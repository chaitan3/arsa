[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# the server-side module of the vnc crate lives on the upstream git branch,
# not in the crates.io release (same patch qemu-display's repo applies)
vnc = { git = "https://github.com/elmarco/rust-vnc", branch = "server" }
ibverbs = { git = "https://github.com/jonhoo/rust-ibverbs" }
rdma-display-proto = { path = "crates/proto" }
rdma-display-codec = { path = "crates/codec" }
qemu-display = { git = "https://gitlab.com/marcandre.lureau/qemu-display", default-features = false, features = ["qmp"] }
async-std = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = true
