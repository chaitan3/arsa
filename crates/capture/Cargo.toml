[package]
name = "rdma-display-capture"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
# XDG Desktop Portal screen capture (`--source portal`): compositor-mediated
# capture over PipeWire — no root/CAP_SYS_ADMIN and no direct-scanout blank
# frames. On by default (one server binary); `--no-default-features` builds
# without PipeWire for a host that has none.
default = ["portal"]
portal = ["dep:ashpd", "dep:pipewire"]

[dependencies]
async-trait = "0.1"
rdma-display-proto.workspace = true
rdma-display-egl = { path = "../egl" }
rdma-display-lifecycle = { path = "../lifecycle" }
qemu-display.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-std.workspace = true
anyhow.workspace = true
libc = "0.2"
libloading = "0.8"
log.workspace = true
# `--source portal` (feature `portal`): portal D-Bus (ashpd) + the PipeWire stream
ashpd = { version = "0.12", default-features = false, features = ["async-std"], optional = true }
pipewire = { version = "0.10", optional = true, features = ["v0_3_33"] }
