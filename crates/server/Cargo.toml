[package]
name = "rdma-display-server"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
# XDG Desktop Portal screen capture (`--source portal`); on by default so there
# is a single server binary. `--no-default-features` drops PipeWire.
default = ["portal"]
portal = ["rdma-display-capture/portal"]

[[bin]]
name = "arsa-server"
path = "src/main.rs"

[[bin]]
name = "arsa-rdma-diag"
path = "src/bin/arsa-rdma-diag.rs"

[dependencies]
rdma-display-proto.workspace = true
rdma-display-rdma = { path = "../rdma" }
# The server's `portal` feature re-enables capture/portal; without it,
# `--no-default-features` must not pull PipeWire in through capture's default.
rdma-display-capture = { path = "../capture", default-features = false }
rdma-display-codec = { path = "../codec" }
rdma-display-vkcodec = { path = "../vkcodec" }
rdma-display-vkcore = { path = "../vkcore" }
rdma-display-audio = { path = "../audio" }
rdma-display-auth = { path = "../auth" }
anyhow.workspace = true
ibverbs.workspace = true
libc = "0.2"
serde_json = "1"
log.workspace = true
env_logger.workspace = true
