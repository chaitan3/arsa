[package]
name = "qemu-vnc"
version = "0.1.0"
edition = "2021"
publish = false

# Vendored from the qemu-display repo (rev 6ffedb9) and patched locally:
#  - the EGL dmabuf path (scanout_dmabuf/update_dmabuf) so the bridge works
#    with gl=on guests, where QEMU never sends plain updates
#  - keysym->qnum mapping generated in-tree (keycodemap's full crate is not
#    vendored; see src/keymap.rs)
# No dependencies on the other rdma-display crates: the EGL import path is a
# trimmed copy of the capture crate's proven EGL/GL recipe, but standalone.

[dependencies]
qemu-display.workspace = true
vnc.workspace = true
clap = { version = "4.5", features = ["derive"] }
libc = "0.2.155"
image = "0.25"
derivative = "2.2.0"
async-io = "2.3"
async-trait = "0.1.81"
zbus = { version = "5", default-features = false, features = ["async-io"] }
anyhow = "1"
libloading = "0.8"
